; PHP 8.0 óta az error_reporting alapértéke E_ALL (7.4-en az E_DEPRECATED még ki volt zárva),
; a php.ini nélküli docker image-ben pedig display_errors=STDOUT. Emiatt a vendor csomagok
; fordítási idejű deprecationjei (pl. api-platform 2.7 "Implicitly marking parameter as nullable")
; a cache újraépítése utáni első kérésnél a HTML/JSON válasz elejére íródnának.
; A hibák ne a kimenetbe, hanem a logba (php-fpm: docker logs, CLI: stderr) kerüljenek;
; az alkalmazás szintű deprecationöket a Symfony ErrorHandler továbbra is a var/log-ba írja.
display_errors = Off
display_startup_errors = Off
log_errors = On
