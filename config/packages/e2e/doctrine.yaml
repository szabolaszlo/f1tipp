doctrine:
    orm:
        second_level_cache:
            enabled: true
            region_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
        auto_generate_proxy_classes: false
        metadata_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        result_cache_driver:
            type: pool
            pool: doctrine.result_cache_pool

framework:
    cache:
        pools:
            doctrine.result_cache_pool:
                adapter: cache.app
            # nem cache.system (PhpFilesAdapter): azt a PHP-FPM OPcache-ből olvassa, a seedelő CLI-parancs
            # törlése/újraírása után revalidate_freq (2 mp) ideig még a régi entitásokat adná vissza (2LC),
            # és az így számolt tabella a result cache-be is bekerülne
            doctrine.system_cache_pool:
                adapter: cache.adapter.filesystem
